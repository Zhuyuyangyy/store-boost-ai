version: "3.8"

services:
  # ── AI Service ───────────────────────────────────────────────────────
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: storeboost-ai
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - AI_MODEL=${AI_MODEL:-deepseek-ai/deepseek-v4-pro}
      - AI_REQUEST_TIMEOUT=${AI_REQUEST_TIMEOUT:-120.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - storeboost-network

  # ── Redis (Optional) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: storeboost-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - storeboost-network

  # ── MySQL (Optional) ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: storeboost-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-storeboost123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-storeboost}
      - MYSQL_USER=${MYSQL_USER:-storeboost}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-storeboost123}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - storeboost-network

  # ── Development AI Service ──────────────────────────────────────────
  ai-service-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: storeboost-ai-dev
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - AI_MODEL=${AI_MODEL:-deepseek-ai/deepseek-v4-pro}
      - LOG_LEVEL=DEBUG
    env_file:
      - .env
    volumes:
      - ./ai-service:/app/ai-service
      - ./tests:/app/tests
    restart: unless-stopped
    profiles:
      - dev
    networks:
      - storeboost-network

volumes:
  redis-data:
    driver: local
  mysql-data:
    driver: local

networks:
  storeboost-network:
    driver: bridge
